<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Exercice 1 - Plan et skybox</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="hud">
    <h1>Exercice 1 — Plan &amp; Skybox</h1>
    <p>Un sol texturé "herbe" et un skybox panoramique. Aucune interaction requise, juste l'observation de la scène.</p>
    <a class="back-link" href="../index.html">&larr; Retour au sommaire</a>
  </div>

  <a-scene>
    <a-assets>
      <img id="grassTexture" src="../assets/textures/grass.jpg" crossorigin="anonymous" />
      <img id="skyTexture" src="../assets/textures/sky.jpg" crossorigin="anonymous" />
    </a-assets>

    <!-- Sol : plan horizontal large, texture d'herbe répétée -->
    <a-plane
      src="#grassTexture"
      rotation="-90 0 0"
      width="200"
      height="200"
      repeat="40 40"
      shadow="receive: true"
    ></a-plane>

    <!-- Skybox : panorama équirectangulaire enveloppant toute la scène -->
    <a-sky src="#skyTexture" rotation="0 -90 0"></a-sky>

    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8; castShadow: true" position="3 6 2"></a-entity>

    <a-box position="0 0.5 -4" color="#c0392b" shadow></a-box>

    <a-entity camera position="0 1.6 4" look-controls wasd-controls></a-entity>
  </a-scene>
</body>
</html>
